name: bench
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check. The Go and Rust decodes of the fixtures run in one container, so the
  # ratio compares the same machine.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench
          load: true
          push: false
          tags: isyntax-bench:local
          cache-from: type=gha,scope=isyntax-rs-bench
          cache-to: type=gha,mode=max,scope=isyntax-rs-bench
      # docker run, not a RUN layer: a BuildKit cache hit would skip the timing.
      # shell: bash is `bash -eo pipefail`: a pixel-hash mismatch or a ratio over 1.10 (bench.sh
      # exits non-zero and prints a FAIL line) fails the step although tee ends the pipe.
      - shell: bash
        run: |
          { echo '### Decode time of level 0 of the fixtures, ms (lower is better)'; echo
            docker run --rm isyntax-bench:local sh tests/parity/bench.sh; } | tee -a "$GITHUB_STEP_SUMMARY"
      # The SIMD kernels per tier (scalar, AVX2, AVX-512): the table decides which AVX-512
      # kernels stay (docs/safety.md).
      - if: ${{ !cancelled() }}
        shell: bash
        run: |
          { echo '### SIMD kernels, ns per call (lower is better)'; echo
            docker run --rm isyntax-bench:local kernels; } | tee -a "$GITHUB_STEP_SUMMARY"
