name: fuzz
on:
  schedule: [{ cron: '23 6 * * 5' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every target on x86_64 (ubuntu-24.04) and on native aarch64 (ubuntu-24.04-arm), with ASan.
  fuzz:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      # Two fuzz jobs at a time, at most.
      max-parallel: 2
      matrix:
        # `scalar` (ISYNTAX_SIMD=scalar) runs the decodes of the `decode` target on the scalar
        # kernels; the other targets have no kernel under them (`kernels` fuzzes the SIMD tier
        # against scalar and asserts that it has one: AVX2 or AVX-512 on x64, NEON on arm64).
        include:
          - { arch: x64, target: open, simd: default, max_len: 1048576 }
          - { arch: x64, target: decode, simd: default, max_len: 1048576 }
          - { arch: x64, target: decode, simd: scalar, max_len: 1048576 }
          - { arch: x64, target: hulsken, simd: default, max_len: 65536 }
          - { arch: x64, target: tables, simd: default, max_len: 1048576 }
          - { arch: x64, target: kernels, simd: default, max_len: 4096 }
          - { arch: arm64, target: open, simd: default, max_len: 1048576 }
          - { arch: arm64, target: decode, simd: default, max_len: 1048576 }
          - { arch: arm64, target: decode, simd: scalar, max_len: 1048576 }
          - { arch: arm64, target: hulsken, simd: default, max_len: 65536 }
          - { arch: arm64, target: tables, simd: default, max_len: 1048576 }
          - { arch: arm64, target: kernels, simd: default, max_len: 4096 }
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: isyntax-fuzz:local
          cache-from: type=gha,scope=isyntax-rs-fuzz-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=isyntax-rs-fuzz-${{ matrix.arch }}
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per
      # architecture, target and SIMD mode; the newest is restored.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: the Go fuzz tests' f.Add values (tests/fuzz/seeds/<target>, made by `oracle -genseeds` in
      # the image); new inputs go to the first corpus dir. -malloc_limit_mb is the backstop: the
      # open and decode targets choose their Limits from the input (max_alloc 1 to 128 MiB), and a
      # Vec that grows by doubling stays under 256 MiB, so one allocation over 300 MiB came from a
      # size that no limit checked. `cmin` then cuts the corpus to the inputs that add coverage
      # before it is saved: a corpus that grows by every run makes the replay at the start of the
      # next one (minutes for decode) eat the time budget.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} -e ISYNTAX_SIMD=${{ matrix.simd == 'scalar' && 'scalar' || 'auto' }} -e MAX_LEN=${{ matrix.max_len }} isyntax-fuzz:local \
            sh -c 'cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET tests/fuzz/seeds/$TARGET -- -max_len=$MAX_LEN -max_total_time=$MAX_TOTAL_TIME -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=300 && cargo +nightly fuzz cmin --fuzz-dir tests/fuzz $TARGET -- -max_len=$MAX_LEN -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=300'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}
          path: crashers
      - if: always()
        # Replace, not merge: the restored files cmin dropped would otherwise be saved again.
        run: |
          rm -rf corpus-new && docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }} corpus-new \
            && rm -rf corpus/${{ matrix.target }} && mv corpus-new corpus/${{ matrix.target }} || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}-${{ github.run_id }}
